# This runs only when there are changes
when:
  # This runs whenever there is a pull request on main
 - event: pull_request
   branch: main
   path:
    include: ['anhTuan/524H0074.ipynb', '.woodpecker/anhTuan.yaml']

steps:
  # Test run
 - name: test-run
   image: ghcr.io/narwhal1412/da-python-3_12-slim
   commands:
    - jupyter nbconvert --to notebook --execute anhTuan/524H0074.ipynb --output-dir /tmp/out