# This runs only when there are changes
when:
 - event: [push, pull_request]
  # Allow this to run on the personal branch, and when PRing to main
   branch: [main,giaHuy]
   path:
    include: ['giaHuy/test.ipynb', '.woodpecker/giaHuy.yaml']

steps:
  # Test run
 - name: test-run
   image: python:3.12-slim
   commands:
    - pip install nbformat nbconvert ipykernel
    - jupyter nbconvert --to notebook --execute giaHuy/test.ipynb --output-dir /tmp/out